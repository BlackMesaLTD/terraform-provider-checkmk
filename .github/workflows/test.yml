# CI/CD Pipeline for Terraform Provider CheckMK
#
# Uses the same docker-compose.yml and test script as local development.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast checks - no containers
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate docs
        run: GOFLAGS='-tags=checkmk_all' go generate -tags checkmk_all ./...

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain docs/ examples/)" ]; then
            echo "## ❌ Documentation Out of Date" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`go generate ./...\` and commit the changes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changed Files" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            git status --porcelain docs/ examples/ >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Documentation Up to Date" >> $GITHUB_STEP_SUMMARY

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: |
          if ! go test -tags checkmk_all -race -v -skip 'TestAcc' ./... 2>&1 | tee test-output.txt; then
            echo "## ❌ Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep -A 20 "^--- FAIL" test-output.txt >> $GITHUB_STEP_SUMMARY || tail -50 test-output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -tags checkmk_all -v ./...

  # Integration tests - run in parallel across CheckMK versions
  acceptance:
    name: Acceptance (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [unit, lint, build]
    strategy:
      fail-fast: false
      matrix:
        version: ["2.2", "2.3", "2.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Login to CheckMK Registry
        uses: docker/login-action@v3
        with:
          registry: registry.checkmk.com
          username: ${{ secrets.CHECKMK_REGISTRY_USERNAME }}
          password: ${{ secrets.CHECKMK_REGISTRY_PASSWORD }}

      - name: Start container
        run: |
          python3 scripts/generate-compose.py --mode=ci --version=${{ matrix.version }} -o docker-compose.yml
          docker compose up -d --wait --wait-timeout 180

      - name: Run acceptance tests
        run: |
          # Use the Terraform CLI installed above instead of letting
          # terraform-plugin-testing download one via hc-install (whose bundled
          # signing key has expired, breaking checksum verification).
          export TF_ACC_TERRAFORM_PATH="$(which terraform)"
          ./scripts/run_tests.sh --version ${{ matrix.version }} --verbose

      - name: Show logs on failure
        if: failure()
        run: |
          echo "## ❌ Acceptance Tests Failed (CheckMK ${{ matrix.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container Logs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker compose logs --tail=100 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker compose down -v
